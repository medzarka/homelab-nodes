services:
  # ============================================================================
  # 🔒 Tailscale VPN Mesh Client (Host Networking + Tun Device)
  # ============================================================================
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: ${TS_HOSTNAME:-worker-node}
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_NETFILTER_MODE=nodivert
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:---reset --hostname=${TS_HOSTNAME:-worker-node}}
    volumes:
      - /var/lib/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # 🤖 Arcane Edge Agent (Outbound Polling Telemetry & Remote Orchestration)
  # ============================================================================
  arcane-edge-agent:
    image: ghcr.io/getarcaneapp/agent:latest
    container_name: arcane-edge-agent
    restart: unless-stopped
    environment:
      - EDGE_AGENT=true
      - EDGE_TRANSPORT=poll
      - AGENT_TOKEN=${ARCANE_AGENT_TOKEN:-}
      - MANAGER_API_URL=${ARCANE_SERVER_URL:-http://${MASTER_TAILSCALE_IP:-127.0.0.1}:3552}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_DIR:-/srv/data}/arcane-agent:/app/data:z
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
