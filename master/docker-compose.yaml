services:
  # ============================================================================
  # 🔒 Tailscale VPN Mesh Client (Host Networking + Tun Device)
  # ============================================================================
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: ${TS_HOSTNAME:-master-node}
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_NETFILTER_MODE=nodivert
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:---reset --hostname=${TS_HOSTNAME:-master-node}}
    volumes:
      - /var/lib/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # 🧙 Arcane Manager (Centralized Multi-Node GUI & GitOps Orchestrator)
  # ============================================================================
  arcane:
    image: ghcr.io/getarcaneapp/arcane:latest
    container_name: arcane
    restart: unless-stopped
    environment:
      - APP_URL=${ARCANE_APP_URL:-http://localhost:3552}
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host
      - ADDRESS_HEADER=x-forwarded-for
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - ALLOW_CLI_PASSWORD_RESET=${ALLOW_CLI_PASSWORD_RESET:-true}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    ports:
      - "0.0.0.0:${ARCANE_PORT:-3552}:3552"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_DIR:-/srv/data}/arcane:/app/data:z
    networks:
      - shared_net
      - homelab_swarm_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.arcane.rule=Host(`arcane.${ROOT_DOMAIN:-example.com}`)"
      - "traefik.http.routers.arcane.entrypoints=websecure"
      - "traefik.http.routers.arcane.tls=true"
      - "traefik.http.routers.arcane.middlewares=app-fail2ban@file,security-headers@file,compression@file"
      - "traefik.http.services.arcane.loadbalancer.server.port=3552"
      - "traefik.docker.network=${SWARM_NETWORK:-homelab_swarm_net}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # 🛡️ Arcane Secure Bootstrap Reverse Proxy (Lightweight Caddy + Basic Auth)
  # ============================================================================
  # Provides immediate, secure out-of-band access to Arcane before Traefik is deployed.
  arcane-proxy:
    image: caddy:alpine
    container_name: arcane_proxy
    restart: unless-stopped
    ports:
      - "${ARCANE_BOOTSTRAP_PORT:-8005}:${ARCANE_BOOTSTRAP_PORT:-8005}"
    environment:
      - ARCANE_BOOTSTRAP_PORT=${ARCANE_BOOTSTRAP_PORT:-8005}
      - ARCANE_PROXY_USER=${ARCANE_PROXY_USER:-admin}
      - ARCANE_PROXY_PASSWORD=${ARCANE_PROXY_PASSWORD:-arcane-bootstrap-admin}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - shared_net
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        HASH=$$(caddy hash-password --plaintext "$$ARCANE_PROXY_PASSWORD")
        export ARCANE_PROXY_HASH="$$HASH"
        echo ">>> [Arcane Bootstrap Proxy] Starting Caddy on port $$ARCANE_BOOTSTRAP_PORT for user '$$ARCANE_PROXY_USER'..."
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    depends_on:
      - arcane
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  shared_net:
    name: ${SHARED_NETWORK:-shared_net}
    external: true
  homelab_swarm_net:
    name: ${SWARM_NETWORK:-homelab_swarm_net}
    external: true
